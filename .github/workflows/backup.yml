name: Backup base de datos

on:
  schedule:
    - cron: "30 5 * * *" # todos los dias, despues del keep-alive
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Variables PG* estandar que pg_dump lee solo, sin parsear ninguna URL
    # (evita líos con caracteres especiales en la contraseña, como "$").
    env:
      PGHOST: ${{ secrets.SUPA_HOST }}
      PGPORT: ${{ secrets.SUPA_PORT }}
      PGDATABASE: postgres
      PGUSER: ${{ secrets.SUPA_USER }}
      PGPASSWORD: ${{ secrets.SUPA_PASSWORD }}
      PGSSLMODE: require
    steps:
      # El pg_dump que trae Ubuntu por defecto es de una version vieja de
      # Postgres y se niega a dumpear un server mas nuevo (Supabase corre
      # Postgres 17). Instalamos el cliente 17 desde el repo oficial de PGDG.
      - name: Instalar cliente de Postgres 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-17

      # set -o pipefail: si pg_dump falla, que falle el paso entero en vez de
      # quedar tapado por el "éxito" de gzip con un input vacío.
      # Solo el schema "public" (nuestras tablas/funciones): ni auth (emails,
      # hashes de contraseña) ni storage (metadata interna) — ni hace falta
      # para restaurar, ni conviene tenerlo en un dump.
      - name: Dump de la base
        shell: bash
        run: |
          set -o pipefail
          pg_dump --schema=public --no-owner --no-privileges | gzip > backup.sql.gz
          ls -la backup.sql.gz

      - name: Clonar el repo privado de backups
        run: git clone --depth 1 "https://x-access-token:${{ secrets.BACKUP_TOKEN }}@github.com/aleortizzz/tizdigital-backups.git" backups-repo

      # Guarda el dump de hoy y se queda solo con los últimos 7 (borra el
      # resto) para que la carpeta nunca crezca sin límite.
      - name: Guardar y rotar
        run: |
          mkdir -p backups-repo/asiste/db
          cp backup.sql.gz "backups-repo/asiste/db/$(date +%F).sql.gz"
          cd backups-repo/asiste/db
          ls -1t *.sql.gz | tail -n +8 | xargs -r rm --
          cd ../../..
          cd backups-repo
          git config user.email "backup-bot@asiste.local"
          git config user.name "Asiste Backup Bot"
          git add -A
          git diff --cached --quiet || git commit -m "Backup asiste $(date +%F)"
          git push
