name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      # El FTP de Hostinger corta la conexion de control seguido. Config
      # conservadora: una sola conexion, PASV forzado (sin EPSV), timeouts
      # altos y debug 3 para ver el error real si vuelve a fallar.
      - name: Deploy por FTP a Hostinger (lftp)
        uses: nick-fields/retry@v3
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 45
          command: |
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            set ftp:passive-mode true
            set ftp:prefer-epsv false
            set net:timeout 45
            set net:max-retries 4
            set net:reconnect-interval-base 10
            set net:connection-limit 1
            set mirror:parallel-transfer-count 1
            set ftp:use-mdtm false
            debug 3
            mirror -R --verbose --exclude-glob .git/ ./dist/ /
            bye
            LFTP
