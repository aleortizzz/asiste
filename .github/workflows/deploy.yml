name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      # El FTPS de Hostinger corta la conexion de control seguido con el action
      # de FTP ("Timeout (control socket)"). lftp aguanta mucho mejor las
      # conexiones inestables: reconecta solo y reintenta cada archivo.
      - name: Deploy por FTP a Hostinger (lftp)
        uses: nick-fields/retry@v3
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 30
          command: >-
            lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set net:persist-retries 5;
            set ftp:use-mdtm false;
            mirror -R --verbose --parallel=2 --exclude-glob .git/ ./dist/ / ;
            quit
            " -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER"
