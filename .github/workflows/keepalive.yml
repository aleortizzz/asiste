name: Keep-alive Supabase

# El plan Free de Supabase pausa el proyecto tras 7 dias sin actividad en la
# base. Este job hace una consulta trivial una vez por dia para que nunca
# llegue a ese limite. Llama a la RPC publica `obtener_invitacion` con un slug
# inexistente: ejecuta un SELECT real (cuenta como actividad) y no escribe nada.

on:
  schedule:
    - cron: "17 6 * * *" # todos los dias 06:17 UTC (~03:17 ART)
  workflow_dispatch: # permite dispararlo a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta de keep-alive
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Normaliza la URL por si el secret trae "/" o "/rest/v1" al final.
          BASE=$(echo "$SUPABASE_URL" | sed -E 's#/+$##; s#/rest/v1$##')
          echo "Pingeando $BASE/rest/v1/rpc/obtener_invitacion"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$BASE/rest/v1/rpc/obtener_invitacion" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_slug":"keepalive"}')
          echo "HTTP $CODE"
          # 2xx = ok. Cualquier respuesta del servidor ya implica que la base
          # atendio la request; solo fallamos ante errores de servidor/red.
          if [ "$CODE" -ge 500 ] || [ "$CODE" -eq 000 ]; then
            echo "Keep-alive fallo"
            exit 1
          fi
