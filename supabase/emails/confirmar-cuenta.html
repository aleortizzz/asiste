<!--
  Mail de «Confirm signup» de Supabase.
  Pegar en Supabase → Authentication → Emails → Confirm signup.
  Asunto: Confirmá tu cuenta de Asiste
  Variables de Supabase: {{ .ConfirmationURL }}
  Estilos en línea y tablas: muchos programas de mail no leen <style>.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e2e2df;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
        <tr>
          <td style="padding:0 8px 16px;"><img src="https://asiste.tizdigital.com/brand/asiste-logo.png?v=2" width="148" height="48" alt="ASISTE" style="display:block;border:0;height:48px;width:auto;font-size:30px;font-weight:900;color:#4e1f6e;" /></td>
        </tr>
        <tr>
          <td style="background:#ffffff;border-radius:28px;padding:36px 32px;">
            <p style="margin:0 0 12px;font-size:24px;font-weight:700;color:#070607;">¡Ya casi está!</p>
            <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#57525a;">
              Confirmá tu mail para empezar a armar tu invitación. Es un solo toque.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="background:#4e1f6e;border-radius:999px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;">Confirmar mi cuenta</a>
                </td>
              </tr>
            </table>
            <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#8a848e;">
              Si no creaste una cuenta en Asiste, ignorá este mail: no pasa nada.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 8px 0;font-size:12px;color:#7a757c;">Asiste · TizDigital · asiste.tizdigital.com</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
